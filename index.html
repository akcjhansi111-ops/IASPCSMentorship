<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IAS & PCS Mentorship | Bilingual Test Series</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#14213d;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    font-size:28px;
    margin-bottom:8px;
}

header p{
    font-size:16px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:25px 15px;
}

.hero{
    background:white;
    border-radius:20px;
    padding:30px 25px;
    margin-bottom:30px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.hero h2{
    font-size:32px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    line-height:1.7;
}

.section-title{
    font-size:30px;
    margin:25px 0;
}

.exam-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.exam-card{
    background:white;
    border:3px solid #e1e6ef;
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
    cursor:pointer;
    transition:.25s;
}

.exam-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,.12);
    border-color:#14213d;
}

.exam-icon{
    font-size:42px;
    margin-bottom:10px;
}

.exam-card h3{
    font-size:27px;
    margin-bottom:8px;
}

.exam-card p{
    font-size:17px;
    color:#555;
}

button{
    border:none;
    background:#14213d;
    color:white;
    padding:13px 24px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    margin-top:18px;
}

button:hover{
    opacity:.9;
}

.back-btn{
    background:#555;
    margin-bottom:20px;
}

.test-list{
    display:grid;
    gap:15px;
}

.test-card{
    background:white;
    border-radius:16px;
    padding:22px;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.test-card h3{
    margin-bottom:7px;
}

.test-card p{
    color:#666;
}

.test-card button{
    margin:0;
    white-space:nowrap;
}

.quiz-box{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.progress{
    margin-bottom:20px;
    font-weight:bold;
}

.question{
    white-space:pre-line;
    font-size:21px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:20px;
}

.option{
    white-space:pre-line;
    display:block;
    width:100%;
    text-align:left;
    background:#f4f7fb;
    color:#172033;
    border:2px solid #e0e5ed;
    margin:10px 0;
}

.option:hover{
    background:#e9eef7;
}

.option.selected{
    background:#dce8ff;
    border-color:#14213d;
}

.quiz-actions{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.result{
    text-align:center;
}

.result h2{
    font-size:32px;
    margin-bottom:15px;
}

.score{
    font-size:50px;
    font-weight:bold;
    color:#14213d;
    margin:20px;
}

.answer-review{
    text-align:left;
    margin-top:25px;
}

.review-item{
    background:#f7f7f7;
    padding:15px;
    margin:12px 0;
    border-radius:10px;
}

.correct{
    border-left:5px solid green;
}

.wrong{
    border-left:5px solid red;
}

.hidden{
    display:none;
}

footer{
    margin-top:40px;
    background:#14213d;
    color:white;
    text-align:center;
    padding:25px 15px;
    line-height:1.8;
}

@media(max-width:700px){

    .exam-grid{
        grid-template-columns:1fr;
    }

    .hero h2{
        font-size:28px;
    }

    .section-title{
        font-size:27px;
    }

    .test-card{
        flex-direction:column;
        align-items:flex-start;
    }

    .test-card button{
        width:100%;
    }

    .quiz-actions button{
        width:48%;
    }
}
</style>
</head>

<body>

<header>
<h1>IAS & PCS Mentorship</h1>
<p>UPSC • BPSC • UPPSC • SSC • State PCS</p>
</header>

<div class="container">

<section id="home">

<div class="hero">
<h2>📚 Competitive Exam Test Series</h2>

<p>

</p>
</div>
